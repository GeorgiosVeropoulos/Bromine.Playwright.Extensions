name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  DOTNET_VERSION: '8.0.x'
  # Engines to install AND to run, declared once. Space-separated so the same value works
  # as the `playwright install` argument list and as the test-side engine filter.
  PW_ENGINES: chromium

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore --source https://api.nuget.org/v3/index.json

      - name: Build
        run: |
          dotnet build Analyzers/Bromine.Playwright.Extensions.Analyzers.csproj -c Release --no-restore
          dotnet build -c Release --no-restore

      - name: Install Playwright browsers
        run: pwsh tests/bin/Release/net8.0/playwright.ps1 install ${{ env.PW_ENGINES }} --with-deps

      - name: Run tests
        run: >
          dotnet test tests/Bromine.Playwright.Extensions.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory tests/TestResults
        # PW_ENGINES comes from the workflow env above, so the fixtures for engines that
        # aren't installed are skipped by config instead of attempting a launch.
        # Headless is the test default, so nothing extra is needed for that.

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: tests/TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: tests/TestResults/results.trx

