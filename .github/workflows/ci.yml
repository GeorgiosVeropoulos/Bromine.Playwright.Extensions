lname: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore --source https://api.nuget.org/v3/index.json

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Install Playwright browsers
        run: pwsh tests/bin/Release/net8.0/playwright.ps1 install chromium --with-deps

      - name: Run tests
        run: dotnet test tests/Bromine.Playwright.Extensions.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: tests/TestResults/results.trx

