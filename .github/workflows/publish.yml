name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'
  # Engines to install AND to run, declared once.
  PW_ENGINES: chromium

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # An annotated tag's message lives in the tag object, which the default shallow
          # fetch does not reliably bring down. Without this the release notes come out empty.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Read tag message
        id: notes
        run: |
          # %(contents) is the annotated tag's message. On a *lightweight* tag git silently
          # falls back to the tagged commit's message, so a forgotten `-a` degrades to
          # something sensible rather than publishing empty notes.
          {
            echo 'BODY<<TAGMSGEOF'
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME"
            echo 'TAGMSGEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Restore dependencies
        run: dotnet restore --source https://api.nuget.org/v3/index.json

      - name: Build
        run: |
          dotnet build Analyzers/Bromine.Playwright.Extensions.Analyzers.csproj -c Release --no-restore
          dotnet build -c Release --no-restore /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Install Playwright browsers
        run: pwsh tests/bin/Release/net8.0/playwright.ps1 install ${{ env.PW_ENGINES }} --with-deps

      - name: Run tests
        run: dotnet test tests/Bromine.Playwright.Extensions.Tests.csproj -c Release --no-build

      - name: Pack
        # Passed as an environment variable rather than /p: — MSBuild picks env vars up as
        # properties, which avoids shell quoting and MSBuild escaping on free-text notes.
        env:
          PackageReleaseNotes: ${{ steps.notes.outputs.BODY }}
        run: dotnet pack src/Bromine.Playwright.Extensions.csproj -c Release --no-build -o ./nupkgs /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./nupkgs/*.nupkg
          # Your tag message becomes the release body; the auto-generated commit/PR list
          # is appended after it.
          body: ${{ steps.notes.outputs.BODY }}
          generate_release_notes: true

