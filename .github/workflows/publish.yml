name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore --source https://api.nuget.org/v3/index.json

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Install Playwright browsers
        run: pwsh tests/bin/Release/net8.0/playwright.ps1 install chromium --with-deps

      - name: Run tests
        run: dotnet test tests/Bromine.Playwright.Extensions.Tests.csproj -c Release --no-build
        env:
          CI: true

      - name: Pack
        run: dotnet pack src/Bromine.Playwright.Extensions.csproj -c Release --no-build -o ./nupkgs /p:Version=${{ steps.version.outputs.VERSION }}

      - name: Push to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./nupkgs/*.nupkg
          generate_release_notes: true

